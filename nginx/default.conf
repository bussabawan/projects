# Nginx configuration for Next.js App (OT Project 2026)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ปรับขนาดไฟล์อัปโหลดสูงสุดที่อนุญาต (รูปภาพ, ไฟล์เสียง)
    client_max_body_size 100M;

    # บันทึก Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression เพื่อเพิ่มความเร็วในการโหลด
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        # รองรับ WebSockets และ HTTP upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # ส่งต่อ Header สำคัญเพื่อให้ Next.js และ Auth.js ทราบ Client IP และ Protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ขยายเวลา Timeout สำหรับการอัปโหลดไฟล์ขนาดใหญ่
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # จัดการ Error Pages (Optional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
